  <circle cx="174" cy="721" r="31" fill="#27D7D0" stroke="#071022" stroke-width="12"/>
  <circle cx="460" cy="567" r="31" fill="#39C5E4" stroke="#071022" stroke-width="12"/>
  <circle cx="754" cy="377" r="31" fill="#51A8FF" stroke="#071022" stroke-width="12"/>
