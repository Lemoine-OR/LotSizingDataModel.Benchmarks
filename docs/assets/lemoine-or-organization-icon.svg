<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lemoine-OR organization icon</title>
  <desc id="desc">A geometric L and OR monogram crossed by an optimization path.</desc>
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="920" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1739"/>
      <stop offset="1" stop-color="#071022"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="790" x2="850" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27D7D0"/>
      <stop offset="1" stop-color="#51A8FF"/>
    </linearGradient>
